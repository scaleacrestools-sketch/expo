<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 110" width="600" height="110" role="img" aria-labelledby="t"><title id="t">Five-step campaign workflow</title><line x1="60" x2="540" y1="50" y2="50" stroke="#E4E4E7" stroke-width="2"/><line x1="60" x2="540" y1="50" y2="50" stroke="#8B5CF6" stroke-width="2" stroke-dasharray="480" stroke-dashoffset="480"><animate attributeName="stroke-dashoffset" values="480;0" dur="5s" repeatCount="indefinite"/></line><circle cx="60" cy="50" r="12" fill="#fff" stroke="#8B5CF6" stroke-width="2"/><text x="60" y="54" text-anchor="middle" font-family="Inter,Arial" font-size="10" font-weight="700" fill="#8B5CF6">1</text><text x="60" y="88" text-anchor="middle" font-family="Inter,Arial" font-size="12.5" fill="#0F0F14">Import</text><circle cx="180" cy="50" r="12" fill="#fff" stroke="#8B5CF6" stroke-width="2"/><text x="180" y="54" text-anchor="middle" font-family="Inter,Arial" font-size="10" font-weight="700" fill="#8B5CF6">2</text><text x="180" y="88" text-anchor="middle" font-family="Inter,Arial" font-size="12.5" fill="#0F0F14">Configure</text><circle cx="300" cy="50" r="12" fill="#fff" stroke="#8B5CF6" stroke-width="2"/><text x="300" y="54" text-anchor="middle" font-family="Inter,Arial" font-size="10" font-weight="700" fill="#8B5CF6">3</text><text x="300" y="88" text-anchor="middle" font-family="Inter,Arial" font-size="12.5" fill="#0F0F14">Converse</text><circle cx="420" cy="50" r="12" fill="#fff" stroke="#8B5CF6" stroke-width="2"/><text x="420" y="54" text-anchor="middle" font-family="Inter,Arial" font-size="10" font-weight="700" fill="#8B5CF6">4</text><text x="420" y="88" text-anchor="middle" font-family="Inter,Arial" font-size="12.5" fill="#0F0F14">Qualify</text><circle cx="540" cy="50" r="12" fill="#fff" stroke="#8B5CF6" stroke-width="2"/><text x="540" y="54" text-anchor="middle" font-family="Inter,Arial" font-size="10" font-weight="700" fill="#8B5CF6">5</text><text x="540" y="88" text-anchor="middle" font-family="Inter,Arial" font-size="12.5" fill="#0F0F14">Schedule</text></svg>
