# Used when the site is deployed from Git or with the Netlify CLI (build runs on Netlify).
# For a manual drag-and-drop / ZIP deploy, the equivalent _redirects and _headers files are already inside dist/.
[build]
  command = "npm install --no-audit --no-fund && node build.js"
  publish = "dist"
  functions = "netlify/functions"

[functions]
  node_bundler = "esbuild"
  included_files = ["api/**"]
