<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" xmlns:inkscape="http://www.inkscape.org/namespaces/inkscape" width="1600" height="1000" viewBox="0 0 1600 1000">
<title>STFE 2027 — Brand Identity &amp; Exhibition Experience · Visual concept</title>
<desc>STFE 2027 brand identity. Fonts: Rajdhani and Manrope (Google Fonts, SIL OFL) must be installed for correct text rendering. The STFE 2027 logo is the approved raster artwork embedded unaltered.</desc>
<defs><linearGradient id="grad-1" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#8F1D6D"/><stop offset="1" stop-color="#4B325F"/></linearGradient><linearGradient id="grad-2" x1="670.0" y1="500" x2="1570.0" y2="500" gradientUnits="userSpaceOnUse"><stop offset="0" stop-color="#F07A3F"/><stop offset="0.55" stop-color="#DC5560"/><stop offset="1" stop-color="#B13F85"/></linearGradient><radialGradient id="rgrad-4" cx="0.5" cy="0.5" r="0.5"><stop offset="0" stop-color="#F07A3F" stop-opacity="0.55"/><stop offset="0.6" stop-color="#B13F85" stop-opacity="0.12"/><stop offset="1" stop-color="#B13F85" stop-opacity="0"/></radialGradient></defs>
<g id="background" inkscape:groupmode="layer" inkscape:label="Background"><rect id="canvas-bg" x="0.0" y="0.0" width="1600.0" height="1000.0" rx="0" fill="#8F1D6D"/></g><g id="artwork" inkscape:groupmode="layer" inkscape:label="Artwork"><rect x="0.0" y="0.0" width="1600.0" height="1000.0" rx="0" fill="url(#grad-1)"/><g id="portal-motif-3" opacity="1" fill="none" stroke="url(#grad-2)" stroke-linejoin="miter"><ellipse cx="1159.4" cy="470.4" rx="288.0" ry="320.0" fill="url(#rgrad-4)" stroke="none"/><rect x="670.0" y="0.0" width="900.0" height="1000.0" stroke-width="3.00"/><rect x="737.4" y="64.6" width="776.3" height="862.5" stroke-width="2.83"/><rect x="800.6" y="125.3" width="660.1" height="733.5" stroke-width="2.65"/><rect x="859.5" y="181.8" width="551.9" height="613.2" stroke-width="2.47"/><rect x="914.1" y="234.1" width="451.7" height="501.9" stroke-width="2.30"/><rect x="964.0" y="282.0" width="360.0" height="400.0" stroke-width="2.12"/><rect x="1009.2" y="325.3" width="277.0" height="307.8" stroke-width="1.95"/><rect x="1049.4" y="363.9" width="203.2" height="225.8" stroke-width="1.77"/><rect x="1084.3" y="397.4" width="139.0" height="154.5" stroke-width="1.60"/><rect x="1113.6" y="425.5" width="85.3" height="94.7" stroke-width="1.43"/><rect x="1136.7" y="447.7" width="42.8" height="47.5" stroke-width="1.25"/><rect x="1152.8" y="463.1" width="13.2" height="14.6" stroke-width="1.08"/><line x1="670.0" y1="0.0" x2="1152.8" y2="463.1" stroke-width="1.80"/><line x1="1570.0" y1="0.0" x2="1166.0" y2="463.1" stroke-width="1.80"/><line x1="670.0" y1="1000.0" x2="1152.8" y2="477.8" stroke-width="1.80"/><line x1="1570.0" y1="1000.0" x2="1166.0" y2="477.8" stroke-width="1.80"/></g><text x="100.0" y="250.0" font-family="Rajdhani, 'Rajdhani', 'Arial Narrow', sans-serif" font-size="96" font-weight="700" fill="#FFFFFF" text-anchor="start"><tspan x="100.0" dy="0.0">The Portal</tspan></text><text x="100.0" y="330.0" font-family="Rajdhani, 'Rajdhani', 'Arial Narrow', sans-serif" font-size="34" font-weight="600" fill="#FFB27A" text-anchor="start"><tspan x="100.0" dy="0.0">An aisle opening towards opportunity.</tspan></text><text x="100.0" y="400.0" font-family="Manrope, 'Manrope', Arial, sans-serif" font-size="22" font-weight="500" fill="#FFFFFF" text-anchor="start" opacity="0.88"><tspan x="100.0" dy="0.0">Nested exhibition frames converge on a point of warm</tspan><tspan x="100.0" dy="34.1">light — the stall as a stage, and the aisle as the route</tspan><tspan x="100.0" dy="34.1">to new buyers and partners. It is drawn as pure</tspan><tspan x="100.0" dy="34.1">geometry, so it scales from a badge to an entrance</tspan><tspan x="100.0" dy="34.1">gate.</tspan></text><text x="100.0" y="860.0" font-family="Rajdhani, 'Rajdhani', 'Arial Narrow', sans-serif" font-size="22" font-weight="700" fill="#FFB27A" text-anchor="start"><tspan x="100.0" dy="0.0">01</tspan></text><text x="100.0" y="895.0" font-family="Rajdhani, 'Rajdhani', 'Arial Narrow', sans-serif" font-size="32" font-weight="700" fill="#FFFFFF" text-anchor="start"><tspan x="100.0" dy="0.0">Showcase</tspan></text><text x="300.0" y="860.0" font-family="Rajdhani, 'Rajdhani', 'Arial Narrow', sans-serif" font-size="22" font-weight="700" fill="#FFB27A" text-anchor="start"><tspan x="300.0" dy="0.0">02</tspan></text><text x="300.0" y="895.0" font-family="Rajdhani, 'Rajdhani', 'Arial Narrow', sans-serif" font-size="32" font-weight="700" fill="#FFFFFF" text-anchor="start"><tspan x="300.0" dy="0.0">Connect</tspan></text><text x="500.0" y="860.0" font-family="Rajdhani, 'Rajdhani', 'Arial Narrow', sans-serif" font-size="22" font-weight="700" fill="#FFB27A" text-anchor="start"><tspan x="500.0" dy="0.0">03</tspan></text><text x="500.0" y="895.0" font-family="Rajdhani, 'Rajdhani', 'Arial Narrow', sans-serif" font-size="32" font-weight="700" fill="#FFFFFF" text-anchor="start"><tspan x="500.0" dy="0.0">Grow</tspan></text></g>
</svg>
