<title>STFE 2027 Brand Guidelines — The big idea</title>
<desc>STFE 2027 brand identity. Fonts: Rajdhani and Manrope (Google Fonts, SIL OFL) must be installed for correct text rendering. The STFE 2027 logo is the approved raster artwork embedded unaltered.</desc>
<defs><linearGradient id="grad-1" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#8F1D6D"/><stop offset="1" stop-color="#4B325F"/></linearGradient><linearGradient id="grad-2" x1="1000.0" y1="540" x2="2000.0" y2="540" gradientUnits="userSpaceOnUse"><stop offset="0" stop-color="#F07A3F"/><stop offset="0.55" stop-color="#DC5560"/><stop offset="1" stop-color="#B13F85"/></linearGradient><radialGradient id="rgrad-4" cx="0.5" cy="0.5" r="0.5"><stop offset="0" stop-color="#F07A3F" stop-opacity="0.55"/><stop offset="0.6" stop-color="#B13F85" stop-opacity="0.12"/><stop offset="1" stop-color="#B13F85" stop-opacity="0"/></radialGradient><linearGradient id="grad-5" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#F07A3F"/><stop offset="1" stop-color="#B13F85"/></linearGradient></defs>
<g id="background" inkscape:groupmode="layer" inkscape:label="Background"><rect id="canvas-bg" x="0.0" y="0.0" width="1920.0" height="1080.0" rx="0" fill="#8F1D6D"/></g><g id="artwork" inkscape:groupmode="layer" inkscape:label="Artwork"><rect x="0.0" y="0.0" width="1920.0" height="1080.0" rx="0" fill="url(#grad-1)"/><g id="portal-motif-3" opacity="0.55" fill="none" stroke="url(#grad-2)" stroke-linejoin="miter"><ellipse cx="1559.0" cy="500.7" rx="320.0" ry="345.6" fill="url(#rgrad-4)" stroke="none"/><rect x="1000.0" y="0.0" width="1000.0" height="1080.0" stroke-width="2.40"/><rect x="1083.8" y="74.8" width="850.4" height="918.5" stroke-width="2.25"/><rect x="1161.9" y="144.5" width="711.0" height="767.8" stroke-width="2.09"/><rect x="1234.1" y="209.0" width="581.9" height="628.5" stroke-width="1.94"/><rect x="1300.3" y="268.1" width="463.8" height="500.9" stroke-width="1.79"/><rect x="1360.2" y="321.6" width="356.9" height="385.4" stroke-width="1.64"/><rect x="1413.4" y="369.1" width="261.7" height="282.7" stroke-width="1.48"/><rect x="1459.7" y="410.4" width="179.1" height="193.4" stroke-width="1.33"/><rect x="1498.5" y="445.1" width="109.8" height="118.6" stroke-width="1.18"/><rect x="1529.1" y="472.4" width="55.1" height="59.5" stroke-width="1.03"/><rect x="1550.5" y="491.5" width="17.0" height="18.3" stroke-width="0.87"/><line x1="1000.0" y1="0.0" x2="1550.5" y2="491.5" stroke-width="1.44"/><line x1="2000.0" y1="0.0" x2="1567.5" y2="491.5" stroke-width="1.44"/><line x1="1000.0" y1="1080.0" x2="1550.5" y2="509.8" stroke-width="1.44"/><line x1="2000.0" y1="1080.0" x2="1567.5" y2="509.8" stroke-width="1.44"/></g><rect x="120.0" y="159.0" width="36.0" height="4.0" rx="2.0" fill="url(#grad-5)"/><text x="170.0" y="170.0" font-family="Rajdhani, 'Rajdhani', 'Arial Narrow', sans-serif" font-size="17" font-weight="700" fill="#FFB27A" text-anchor="start" letter-spacing="2.72"><tspan x="170.0" dy="0.0">03 — THE BIG IDEA</tspan></text><text x="112.0" y="380.0" font-family="Rajdhani, 'Rajdhani', 'Arial Narrow', sans-serif" font-size="210" font-weight="700" fill="#FFFFFF" text-anchor="start"><tspan x="112.0" dy="0.0">SHOWCASE</tspan></text><text x="112.0" y="560.0" font-family="Rajdhani, 'Rajdhani', 'Arial Narrow', sans-serif" font-size="210" font-weight="700" fill="#FFFFFF" text-anchor="start"><tspan x="112.0" dy="0.0">YOUR BRAND.</tspan></text><text x="112.0" y="740.0" font-family="Rajdhani, 'Rajdhani', 'Arial Narrow', sans-serif" font-size="150" font-weight="700" fill="#FFB27A" text-anchor="start"><tspan x="112.0" dy="0.0">BUILD CONNECTIONS.</tspan></text><text x="120.0" y="850.0" font-family="Manrope, 'Manrope', Arial, sans-serif" font-size="24" font-weight="500" fill="#FFFFFF" text-anchor="start" opacity="0.9"><tspan x="120.0" dy="0.0">Every touchpoint frames the exhibitor: a stage to be seen, and a door to meet buyers, partners and</tspan><tspan x="120.0" dy="36.0">peers. The Portal motif expresses that idea — an exhibition aisle opening towards opportunity.</tspan></text></g><g id="folio" inkscape:groupmode="layer" inkscape:label="Folio"><line x1="80" y1="1022" x2="1840" y2="1022" stroke="#FFFFFF" stroke-opacity="0.28" stroke-width="1"/><text x="80.0" y="1050.0" font-family="Rajdhani, 'Rajdhani', 'Arial Narrow', sans-serif" font-size="15" font-weight="600" fill="#FFFFFF" fill-opacity="0.72" text-anchor="start" letter-spacing="1.20"><tspan x="80.0" dy="0.0">STFE 2027  ·  BRAND GUIDELINES</tspan></text><text x="960.0" y="1050.0" font-family="Rajdhani, 'Rajdhani', 'Arial Narrow', sans-serif" font-size="15" font-weight="600" fill="#FFFFFF" fill-opacity="0.72" text-anchor="middle" letter-spacing="1.20"><tspan x="960.0" dy="0.0">BIG IDEA</tspan></text><text x="1840.0" y="1050.0" font-family="Rajdhani, 'Rajdhani', 'Arial Narrow', sans-serif" font-size="15" font-weight="700" fill="#FFFFFF" fill-opacity="0.72" text-anchor="end" letter-spacing="1.20"><tspan x="1840.0" dy="0.0">04 / 26</tspan></text></g>
