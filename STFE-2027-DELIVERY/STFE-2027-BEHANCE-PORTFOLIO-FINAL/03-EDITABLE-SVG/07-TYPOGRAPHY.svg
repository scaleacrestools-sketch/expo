ni', 'Arial Narrow', sans-serif" font-size="92" font-weight="700" fill="#F07A3F" text-anchor="start"><tspan x="960.0" dy="0.0">₹69,030</tspan></text><text x="1480.0" y="968.0" font-family="Rajdhani, 'Rajdhani', 'Arial Narrow', sans-serif" font-size="16" font-weight="700" fill="#FFFFFF" text-anchor="end" letter-spacing="2.24" opacity="0.7"><tspan x="1480.0" dy="0.0">PER STALL · INCL. GST</tspan></text><text x="960.0" y="1086.0" font-family="Rajdhani, 'Rajdhani', 'Arial Narrow', sans-serif" font-size="92" font-weight="700" fill="#FFFFFF" text-anchor="start"><tspan x="960.0" dy="0.0">4,000</tspan></text><text x="1480.0" y="1086.0" font-family="Rajdhani, 'Rajdhani', 'Arial Narrow', sans-serif" font-size="16" font-weight="700" fill="#FFFFFF" text-anchor="end" letter-spacing="2.24" opacity="0.7"><tspan x="1480.0" dy="0.0">EXPECTED VISITORS</tspan></text><rect x="120.0" y="1190.0" width="1360.0" height="470.0" rx="18" fill="#2E2850"/><text x="160.0" y="1232.0" font-family="Rajdhani, 'Rajdhani', 'Arial Narrow', sans-serif" font-size="14" font-weight="700" fill="#FFB27A" text-anchor="start" letter-spacing="3.08"><tspan x="160.0" dy="0.0">HIERARCHY</tspan></text><text x="160.0" y="1296.0" font-family="Manrope, 'Manrope', Arial, sans-serif" font-size="13" font-weight="600" fill="#FFFFFF" text-anchor="start" opacity="0.55"><tspan x="160.0" dy="0.0">H1 · Rajdhani 700 · 56/60</tspan></text><text x="480.0" y="1296.0" font-family="Rajdhani, 'Rajdhani', 'Arial Narrow', sans-serif" font-size="56" font-weight="700" fill="#FFFFFF" text-anchor="start"><tspan x="480.0" dy="0.0">Showcase Your Brand.</tspan></text><text x="160.0" y="1384.0" font-family="Manrope, 'Manrope', Arial, sans-serif" font-size="13" font-weight="600" fill="#FFFFFF" text-anchor="start" opacity="0.55"><tspan x="160.0" dy="0.0">H2 · Rajdhani 700 · 40/44</tspan></text><text x="480.0" y="1384.0" font-family="Rajdhani, 'Rajdhani', 'Arial Narrow', sans-serif" font-size="40" font-weight="700" fill="#FFFFFF" text-anchor="sta