      content="1 Estate Consultants is a Bangalore-based real estate advisory firm helping homebuyers and investors discover suitable residential developments with personalised guidance."

  <body>
    <!-- Static copy of the enquiry form so Netlify Forms can detect it at deploy time -->
    <form name="site-visit" data-netlify="true" netlify-honeypot="bot-field" hidden>

      <input type="email" name="email" />
      <input type="tel" name="mobile" />
      <textarea name="message"></textarea>
      <input type="text" name="bot-field" />
    </form>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
