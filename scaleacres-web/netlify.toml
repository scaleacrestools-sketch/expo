# Netlify configuration for the ScaleAcres Next.js site.
# Netlify detects Next.js and applies its OpenNext-based runtime automatically.

[build]
  command = "npm run build"
  publish = ".next"

[build.environment]
  NODE_VERSION = "22"
  NEXT_TELEMETRY_DISABLED = "1"

# Indexing protection is host-based (proxy.ts). Only the hosts listed in PRODUCTION_HOSTS
# are indexable; every *.netlify.app preview is noindex automatically.
# Leave WORDPRESS_ORIGIN unset on the staging site so the redesigned pages render for review.
