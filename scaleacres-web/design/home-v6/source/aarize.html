<html><head><style>
@font-face{font-family:Outfit;src:url(Outfit-Regular.ttf)} @font-face{font-family:Outfit;font-weight:700;src:url(Outfit-Bold.ttf)}
*{margin:0;box-sizing:border-box} body{width:1600px;height:1000px;overflow:hidden;font-family:Outfit}
.bg{position:absolute;inset:0;background:radial-gradient(ellipse 60% 70% at 72% 50%,#2a4a86,#16294f 60%,#0d1a33)}
.grid{position:absolute;inset:0;background-image:linear-gradient(rgba(255,255,255,.04) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.04) 1px,transparent 1px);background-size:80px 80px}
.logo{position:absolute;left:110px;top:330px;width:560px;filter:invert(1) brightness(2)}
.cap{position:absolute;left:114px;top:470px;color:rgba(255,255,255,.7);font-size:26px;letter-spacing:.32em;text-transform:uppercase}
.line{position:absolute;left:114px;top:450px;width:120px;height:3px;background:#38BDF8}
.card{position:absolute;left:820px;top:120px;width:660px;height:750px;border-radius:18px;overflow:hidden;transform:rotate(3deg);box-shadow:0 60px 90px -30px rgba(0,0,0,.7),0 0 0 1px rgba(255,255,255,.08)}
.card img{width:100%;height:100%;object-fit:cover;display:block}
</style></head><body>
<div class="bg"></div><div class="grid"></div>
<img class="logo" src="2025__08__aarize.webp"><div class="line"></div><div class="cap">Commercial · Brand identity</div>
<div class="card"><img src="aarize-stationery-480.webp"></div>
</body></html>
