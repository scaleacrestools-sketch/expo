<!doctype html><html><head><meta charset="utf-8"><style>
@font-face{font-family:"Clash Display";src:url(../../design/home-v8/assets/fonts/clash-display-600.woff2);font-weight:600}
@font-face{font-family:"Satoshi";src:url(../../design/home-v8/assets/fonts/satoshi-500.woff2);font-weight:500}
@font-face{font-family:"Satoshi";src:url(../../design/home-v8/assets/fonts/satoshi-700.woff2);font-weight:700}
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:1210px;height:1100px;overflow:hidden;background:#0B0D0D}
.b{position:absolute;left:0;width:1210px;filter:contrast(1.1) saturate(.85) brightness(.92)}
.vig{position:absolute;inset:0;box-shadow:inset 0 0 260px 80px rgba(11,13,13,.95);background:linear-gradient(180deg,rgba(11,13,13,.55),rgba(11,13,13,0) 22%,rgba(11,13,13,0) 62%,rgba(11,13,13,.96))}
h2{position:absolute;left:64px;bottom:58px;font:600 104px/1 "Clash Display";letter-spacing:-.01em;color:#fff;z-index:9}
.chip{position:absolute;display:flex;align-items:center;gap:10px;padding:12px 18px;border-radius:999px;background:rgba(11,13,13,.72);border:1px solid rgba(56,189,248,.45);color:#fff;font:700 15px Satoshi;letter-spacing:.12em;text-transform:uppercase;backdrop-filter:blur(8px);z-index:8}
.chip i{width:8px;height:8px;border-radius:50%;background:#38BDF8;box-shadow:0 0 12px #38BDF8}
.chip em{font-style:normal;color:#38BDF8}
.ring{position:absolute;z-index:6;border-radius:50%;border:2px solid rgba(56,189,248,.75);box-shadow:0 0 30px rgba(56,189,248,.25),inset 0 0 30px rgba(56,189,248,.12);transform:translate(-50%,-50%) scaleY(.62)}
.pin{position:absolute;width:18px;height:18px;border-radius:50%;background:#38BDF8;box-shadow:0 0 0 6px rgba(56,189,248,.25),0 0 26px 6px rgba(56,189,248,.7);transform:translate(-50%,-50%);z-index:7}
.line{position:absolute;height:1.5px;background:linear-gradient(90deg,rgba(56,189,248,.9),rgba(56,189,248,0));transform-origin:left center;z-index:6}
.bar{position:absolute;bottom:0;width:86px;border-radius:6px 6px 2px 2px;background:linear-gradient(0deg,rgba(20,46,140,.95) 0%,rgba(29,78,216,.92) 50%,rgba(56,189,248,.95) 100%);box-shadow:0 0 50px rgba(56,189,248,.45),inset 0 0 0 1px rgba(255,255,255,.25),inset 14px 0 30px rgba(255,255,255,.18)}
.bar:after{content:"";position:absolute;left:0;right:0;top:100%;height:70%;border-radius:2px;background:linear-gradient(180deg,rgba(29,78,216,.35),rgba(29,78,216,0));filter:blur(3px)}
.screen{position:absolute;overflow:hidden;z-index:4;filter:blur(1.4px) brightness(.95) saturate(.9);box-shadow:0 0 60px rgba(56,189,248,.25)}
.screen img{width:100%;height:100%;object-fit:cover;object-position:center 30%}
.rec{position:absolute;z-index:8;font:700 14px Satoshi;letter-spacing:.16em;color:#fff;display:flex;align-items:center;gap:8px}
.rec i{width:10px;height:10px;border-radius:50%;background:#38BDF8;box-shadow:0 0 12px #38BDF8}
</style></head><body>
<div id="root"></div>
<script>
const s=1210/1080, k=location.hash.slice(1), R=document.getElementById("root"); let h="";
const at=(y,y0)=>(y-y0)*s;
if(k==="strategy"){ const y0=520; h+=`<img class="b" src="st.jpg" style="top:${-y0*s}px">`;
  h+='<div class="vig"></div>'; const cx=704, cy=345; [170,300,450].forEach(r=>h+=`<div class="ring" style="left:${cx}px;top:${cy}px;width:${r*2}px;height:${r*2}px"></div>`);
  [[cx,cy],[cx-300,cy+150],[cx+330,cy-60],[cx+120,cy+250]].forEach(([x,y])=>h+=`<div class="pin" style="left:${x}px;top:${y}px"></div>`);
  h+='<div class="vig"></div>';
  h+=`<div class="chip" style="left:${cx-440}px;top:${cy+120}px"><i></i>Buyer persona</div>`;
  h+=`<div class="chip" style="left:${cx+250}px;top:${cy-150}px"><i></i>Catchment <em>10 km</em></div>`;
  h+=`<div class="chip" style="left:${cx+60}px;top:${cy+300}px"><i></i>Price band</div>`;
  h+=`<div class="chip" style="right:64px;top:80px"><i></i>Market research</div>`;
  h+='<h2>Strategy</h2>';
}
if(k==="execution"){ const y0=430; h+=`<img class="b" src="ex.jpg" style="top:${-y0*s}px">`;
  h+=`<div class="screen" style="left:${240*s}px;top:${at(1060,y0)}px;width:${572*s}px;height:${242*s}px"><img src="ad.jpg"></div>`;
  h+='<div class="vig"></div>';
  h+=`<div class="rec" style="left:${270*s}px;top:${at(1060,y0)-34}px"><i></i>REC · LA WISTERIA AD FILM</div>`;
  h+=`<div class="chip" style="right:64px;top:80px"><i></i>Ad films</div><div class="chip" style="right:64px;top:140px"><i></i>Reels &amp; social</div><div class="chip" style="right:64px;top:200px"><i></i>Media buying</div>`;
  h+='<h2>Execution</h2>';
}
if(k==="growth"){ const y0=760; h+=`<img class="b" src="gr.jpg" style="top:${-y0*s}px">`;
  h+='<div class="vig"></div>';
  h+='<div style="position:absolute;left:520px;bottom:250px;width:620px;height:600px;z-index:6">'+[130,210,300,410,540].map((v,i)=>`<div class="bar" style="left:${i*118}px;height:${v}px"></div>`).join("")+'</div>';
  h+='<div style="position:absolute;left:470px;right:40px;bottom:248px;height:1.5px;background:linear-gradient(90deg,rgba(56,189,248,0),rgba(56,189,248,.8),rgba(56,189,248,0));z-index:7"></div>';
  h+=`<div class="chip" style="left:64px;top:120px"><i></i>Qualified leads <em>↑</em></div><div class="chip" style="left:64px;top:180px"><i></i>Cost per lead <em>↓</em></div><div class="chip" style="left:64px;top:240px"><i></i>Site visits <em>↑</em></div><div class="chip" style="left:64px;top:300px"><i></i>ROI <em>↑</em></div>`;
  h+='<h2>Growth</h2>';
}
R.innerHTML=h;
</script></body></html>
