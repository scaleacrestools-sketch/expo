const Q = new URLSearchParams(location.search);

/* ---------- helpers ---------- */
const clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));

/* ---------- global light ---------- */
const bgGlowA = el("div", "glow", st); const bgGlowB = el("div", "glow", st);

function chapter() {

}
// push-through transition shared by every chapter: arrive from depth, leave toward camera
function chapterFrame(ch, t, opts = {}) {
  const lt = t - ch.a, dur = ch.b - ch.a;
  const kin = opts.noIn ? 1 : eOut(seg(lt, 0, .75)), kout = opts.noOut ? 0 : eIO(seg(lt, dur - .55, dur));

  const op = on ? Math.min(kin, 1 - kout) : 0;

  ch.el.c.style.opacity = op;
  ch.el.c.style.transform = `scale(${sc})`;

}

/* =========================================================================================

const c1 = chapter(); CH[0].el = c1;

  const n = reels.length, step = 360 / n;
  const spin = lerp(-2 * step, -1.2 * step, cam) + 2 * step;   // drift; reel 2 faces camera mid-chapter
  tf(c5.w, `translateY(${L(-10, -60)}px) rotateX(${L(-4, -3)}deg) translateZ(${-RAD + L(-80, 0)}px) rotateY(${spin - 2 * step + lerp(10, 0, eOutX(seg(lt, 0, 1.2)))}deg)`);
  const enter = eOutX(seg(lt, .1, 1.1));
  reels.forEach((e, i) => {
    const a = i * step;
    tf(e, `rotateY(${a}deg) translateZ(${RAD + lerp(-400, 0, enter)}px)`);
    // dim the cards turning away
    const rel = (((a + spin - 2 * step) % 360) + 540) % 360 - 180; const face = Math.cos(rel * Math.PI / 180);
    e.style.opacity = clamp(enter * 1.4) * clamp(.25 + .75 * face);
    e.style.filter = `brightness(${(.45 + .55 * clamp(face)).toFixed(3)})`;
  });
}

/* =========================================================================================
   06 SCALEACRES FINALE — light sweep, the mark and the wordmark; resolves to the loop frame
   ========================================================================================= */
const c6 = chapter(); CH[5].el = c6;
const wm = img(BR + "scaleacres-logo-white.svg", c6.c, "logo");
const WMW = L(560, 640);
const CUT = 0.19; // the mark occupies the left 19% of the lockup; the hub symbol stands in for it
Object.assign(wm.style, { width: WMW + "px", height: "auto", left: W / 2 - WMW * CUT - (WMW * (1 - CUT)) / 2 + "px", top: H * L(.46, .42) + L(165, 185) + "px" });
const sweep = el("div", "", c6.c); Object.assign(sweep.style, { position: "absolute", top: 0, bottom: 0, width: "40%", background: "linear-gradient(90deg, transparent, rgba(56,189,248,.16), transparent)" });
function ch6(t) {
  const ch = CH[5]; const lt = t - ch.a, dur = ch.b - ch.a;
  const kin = eOut(seg(lt, 0, .8)), kout = eIO(seg(lt, 2.4, 3.1));
  const on = t >= ch.a - .01;
  c6.c.style.opacity = on ? kin : 0; c6.c.style.visibility = on ? "visible" : "hidden"; c6.c.style.transform = "none"; c6.c.style.filter = "none";
  drawFilm(filmFin, Math.max(0, lt), on ? kin * (1 - kout) * .55 : 0, 1.04);
  const kw = eOutX(seg(lt, .7, 1.6));
  wm.style.opacity = on ? kw * (1 - kout) : 0;
  wm.style.clipPath = `inset(0 ${(1 - kw) * (1 - CUT) * 100}% 0 ${CUT * 100}%)`;
  sweep.style.left = lerp(-40, 110, seg(lt, .4, 2.4)) + "%"; sweep.style.opacity = on ? (1 - kout) : 0;
}

/* hub: visible at the loop seam (start of 01, end of 06) */
function hubFrame(t) {
  const start = 1 - eIO(seg(t, .15, .85));                 // leaves as the stationery lands
  const fin = eOutX(seg(t, CH[5].a + .3, CH[5].a + 1.2));    // arrives in the finale
  const v = Math.max(start, fin);
  hub.style.opacity = v;
  const s = t < 2 ? lerp(1, .6, eIO(seg(t, .15, .85))) : lerp(.6, 1, fin);
  hubSym.style.transform = `scale(${s}) translateY(${t < 2 ? lerp(0, -40, eIO(seg(t, .15, .85))) : lerp(-40, 0, fin)}px)`;
  hubGlow.style.opacity = v;
}

/* global light drifts slowly, identical at 0 and D */
function lightFrame(t) {
  const a = (t / D) * Math.PI * 2;
  bgGlowA.style.left = W * .5 + Math.cos(a) * W * .22 - 700 + "px"; bgGlowA.style.top = H * .45 + Math.sin(a) * H * .18 - 700 + "px";
  bgGlowB.style.left = W * .5 - Math.cos(a) * W * .26 - 550 + "px"; bgGlowB.style.top = H * .55 - Math.sin(a) * H * .16 - 550 + "px";
}

const vign = el("div", "vign", st);
// stacking: films behind chapters
[filmArch.c, filmProd.c, filmFin.c].forEach((c) => st.insertBefore(c, st.firstChild));
st.insertBefore(bgGlowA, filmArch.c.nextSibling); st.insertBefore(bgGlowB, bgGlowA.nextSibling);
st.appendChild(hub); st.appendChild(vign);

window.render = async (t) => {
  t = ((t % D) + D) % D;
  lightFrame(t); ch1(t); ch2(t); ch3(t); ch4(t); ch5(t); ch6(t); hubFrame(t);
};
window.ready = async () => {
  await document.fonts.ready;
  const ims = [...document.images, ...Object.values(films).flatMap((f) => f.frames)];
  await Promise.all(ims.map((i) => (i.complete ? Promise.resolve() : new Promise((r) => { i.onload = i.onerror = r; }))));
  await Promise.all(ims.map((i) => i.decode().catch(() => {})));
  return { W, H, D, n: ims.length };
};
</script>
