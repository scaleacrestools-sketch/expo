<!doctype html>
<html><head><meta charset="utf-8">
<!--
  Hero background v8: a drifting wall of faceless ScaleAcres work only: JBBR Kanvas and JBBR
  warehouse AI films, a tech film, AI builder renders and render shots from the ad films. Every tile plays a
  ping-pong loop of L seconds; the wall moves one full cycle in T = 5L seconds, so the film loops
  seamlessly. Everything is a function of t, so frames render exactly.
-->
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 1920px; height: 1080px; overflow: hidden; background: #0B0D0D; }
  #wall { position: absolute; inset: 0 16px; display: grid; grid-template-columns: repeat(5, 1fr); gap: 16px; }
  .col { position: relative; overflow: hidden; }
  .stack { display: grid; gap: 16px; will-change: transform; }
  .t { position: relative; border-radius: 22px; overflow: hidden; background: #15181B; }
  .t.sq { aspect-ratio: 1/1; } .t.tall { aspect-ratio: 9/16; } .t.pt { aspect-ratio: 4/5; }
  .t video { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; display: block; }
</style></head>
<body><div id="wall"></div>
<script>
  const L = 9.68, T = L * 5, GAP = 16;
  const S = (n) => ({ k: "sq", n }), V = (n) => ({ k: "tall", n });
  // 20 tiles from the "Builders AI Videos" Drive folder (d-*: Auriga 9, DTC Sojon, Kanvas, Pravya, La Wisteria,
  // SkyByte, JBBR Krystal and JBBR warehouse films, each cropped clear of captions and logos) plus 10 ScaleAcres
  // AI films (JBBR Kanvas gate and township, JBBR warehouse, tech data film, AI tower render).
  const P = (n) => ({ k: "pt", n });
  const cols = [
    [P("d-dtc-towers"), V("kv-gate-a"), P("d-sb-lagoon"), S("d-kry-night"), P("d-auriga-night"), S("kv-plots")],
    [V("wh-blueprint"), P("d-sbai-plots"), S("d-sbad-highway"), P("d-pravya-drive"), P("d-dtc-metro"), S("kv-aerial")],
    [P("d-sbr-holo"), S("d-kry-plot"), V("tech-data"), P("d-sb-beach"), P("d-jbbr-wh-a"), S("wh-night")],
    [P("d-auriga-tower"), V("kv-gate-b"), P("d-dtc-garden"), S("wh-dock"), P("d-sbr-street"), V("336116a6")],
    [P("d-kanvas-plots"), V("wh-aerial"), P("d-sb-villas"), P("d-jbbr-wh-b"), P("d-sbai-villas"), P("d-dtc-podium")],
  ];
  const wall = document.getElementById("wall");
  const tiles = [];
  cols.forEach((c, ci) => {
    const col = document.createElement("div"); col.className = "col";
    const st = document.createElement("div"); st.className = "stack"; col.appendChild(st);
    for (let rep = 0; rep < 2; rep++) for (const [i, m] of c.entries()) {
      const t = document.createElement("div"); t.className = "t " + m.k;
      const v = document.createElement("video"); v.src = `seg/${m.n}.webm`; v.muted = true; v.preload = "auto";
      t.appendChild(v); tiles.push({ v, o: (ci * 1.9 + i * 2.7 + rep * 3.3) % L });
      st.appendChild(t);
    }
    wall.appendChild(col);
  });
  const stacks = [...document.querySelectorAll(".stack")];
  const cycles = [];
  window.ready = Promise.all([...document.querySelectorAll("video")].map((v) => new Promise((r) => v.readyState >= 2 ? r() : v.addEventListener("loadeddata", r, { once: true })))).then(() => {
    stacks.forEach((st, si) => { const kids = st.children, n = cols[si].length; let h = 0; for (let i = 0; i < n; i++) h += kids[i].getBoundingClientRect().height + GAP; cycles[si] = h; });
  });
  window.render = async (t) => {
    stacks.forEach((s, i) => {
      const cycle = cycles[i], k = (t / T) % 1, dir = i % 2 ? 1 : -1, start = i % 2 ? -cycle : -cycle * 0.35 - i * 90;
      s.style.transform = `translate3d(0, ${(start + dir * k * cycle).toFixed(2)}px, 0)`;
    });
    const seeks = [];
    for (const x of tiles) {
      const want = Math.min((t + x.o) % L, L - 0.05);
      if (Math.abs(x.v.currentTime - want) > 0.001) seeks.push(new Promise((r) => { x.v.addEventListener("seeked", r, { once: true }); x.v.currentTime = want; }));
    }
    await Promise.all(seeks);
  };
</script></body></html>
