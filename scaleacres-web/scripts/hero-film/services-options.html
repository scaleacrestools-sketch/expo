<!doctype html>
<html><head><meta charset="utf-8">
<!--
  Services visual, three options (?o=A|B|C). All show a real ScaleAcres ad (the La Wisteria film for
  SeaBreeze Villas) running on a phone, with campaign results above the screen. Results are the
  figures ScaleAcres publishes on its case-study cards, always labelled with their campaign.
  Every motion is a function of t; the loop is 16 s.
-->
<style>
  @font-face { font-family: "Outfit"; src: url(outfit.woff2) format("woff2"); font-weight: 100 900; }
  @font-face { font-family: "Playfair Display"; src: url(playfair-600-italic.woff2) format("woff2"); font-weight: 600; font-style: italic; }
  :root { --ink: #0B0D0D; --royal: #1D4ED8; --deep: #142E8C; --sky: #38BDF8; --mist: #EEF2FB; }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 1800px; height: 1200px; overflow: hidden; font-family: Outfit, sans-serif; }
  #stage { position: absolute; inset: 0; overflow: hidden; }
  .abs { position: absolute; will-change: transform; }
  svg { display: block; }

  /* phone */
  .phone { position: absolute; width: 384px; height: 790px; border-radius: 56px; padding: 13px;
    background: linear-gradient(145deg, #2a2e33, #0b0d0d 42%, #181b1e);
    box-shadow: 0 70px 120px -40px rgba(11,13,13,.55), 0 30px 60px -24px rgba(20,46,140,.25), inset 0 0 0 1.5px rgba(255,255,255,.12); }
  .screen { position: relative; width: 100%; height: 100%; border-radius: 44px; overflow: hidden; background: #000; }
  .island { position: absolute; left: 50%; top: 12px; width: 112px; height: 30px; margin-left: -56px; border-radius: 20px; background: #000; z-index: 9; }
  .full video { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
  .blurfill { position: absolute; inset: -40px; filter: blur(26px) brightness(.5) saturate(1.15); }
  .blurfill video { width: 100%; height: 100%; object-fit: cover; }
  .sq { position: absolute; left: 0; right: 0; top: 50%; margin-top: -179px; height: 358px; z-index: 0; box-shadow: 0 0 40px rgba(0,0,0,.35); }
  .sq video { width: 100%; height: 100%; object-fit: cover; display: block; }
  .shade { position: absolute; inset: 0; background: linear-gradient(180deg, rgba(0,0,0,.45), transparent 25%, transparent 75%, rgba(0,0,0,.45)); z-index: 1; pointer-events: none; }
  .ui { position: absolute; z-index: 3; color: #fff; }
  .reels-top { left: 22px; right: 22px; top: 58px; display: flex; justify-content: space-between; align-items: center; font-weight: 600; font-size: 21px; }
  .rail { right: 14px; bottom: 150px; display: grid; gap: 22px; justify-items: center; }
  .rail svg { width: 28px; height: 28px; filter: drop-shadow(0 2px 6px rgba(0,0,0,.5)); }
  .who { left: 18px; right: 18px; top: 98px; }
  .who .acc { display: flex; align-items: center; gap: 10px; font-weight: 600; font-size: 15px; }
  .who .av { width: 34px; height: 34px; border-radius: 50%; background: #fff; display: grid; place-items: center; border: 2px solid #fff; }
  .who .av img { width: 26px; }
  .who small { display: block; font-weight: 400; font-size: 12px; opacity: .85; }
  .who p { margin-top: 8px; font-size: 13.5px; line-height: 1.4; opacity: .92; }
  .cta { left: 16px; right: 16px; bottom: 62px; height: 46px; border-radius: 12px; display: flex; align-items: center; justify-content: space-between; padding: 0 16px; font-size: 15px; font-weight: 600; background: rgba(255,255,255,.18); backdrop-filter: blur(10px); border: 1px solid rgba(255,255,255,.25); }
  .cta.blue { background: linear-gradient(90deg, var(--royal), #2f7ae5); border: 0; }
  .bar { left: 16px; right: 16px; bottom: 44px; height: 3px; border-radius: 3px; background: rgba(255,255,255,.28); overflow: hidden; }
  .bar i { display: block; height: 100%; background: #fff; }
  .navb { left: 0; right: 0; bottom: 0; height: 36px; display: flex; justify-content: space-around; align-items: center; background: #000; }
  .navb i { width: 18px; height: 18px; border-radius: 5px; border: 2px solid rgba(255,255,255,.7); }

  /* light glass cards (reference style) */
  .g { border-radius: 22px; background: linear-gradient(160deg, rgba(74,79,86,.92), rgba(44,48,53,.94)); color: #fff;
    box-shadow: 0 34px 60px -26px rgba(11,13,13,.45), 0 10px 22px -12px rgba(11,13,13,.3), inset 0 0 0 1px rgba(255,255,255,.1); }
  .chip { width: 76px; height: 76px; border-radius: 20px; display: grid; place-items: center; }
  .chip svg { width: 40px; height: 40px; }
  .ln { height: 5px; border-radius: 4px; background: rgba(255,255,255,.28); }
  .ln.b { background: rgba(255,255,255,.5); }
  .stat { padding: 18px 22px; min-width: 190px; }
  .stat .n { font-size: 40px; font-weight: 600; letter-spacing: -0.035em; line-height: 1; }
  .stat .n sup { font-size: .5em; color: var(--sky); vertical-align: top; margin-left: 2px; }
  .stat .l { margin-top: 6px; font-size: 13.5px; color: rgba(255,255,255,.72); }
  .stat .ico { display: flex; align-items: center; gap: 8px; font-size: 11.5px; font-weight: 600; letter-spacing: .12em; text-transform: uppercase; color: var(--sky); margin-bottom: 10px; }
  .stat .ico i { width: 7px; height: 7px; border-radius: 50%; background: #34D399; }
  .src { font-size: 14px; color: #5B6470; letter-spacing: .02em; }
  .src b { color: var(--ink); font-weight: 600; }

  /* option B: instagram feed + toasts */
  .ig { position: absolute; inset: 0; background: #fff; color: #111; }
  .ig .status { height: 50px; }
  .ig .head { display: flex; justify-content: space-between; align-items: center; padding: 6px 16px 10px; font-family: "Playfair Display", serif; font-style: italic; font-weight: 600; font-size: 24px; }
  .ig .head span { display: flex; gap: 16px; } .ig .head svg { width: 24px; height: 24px; }
  .ig .post { display: flex; align-items: center; gap: 10px; padding: 10px 14px; border-top: 1px solid #eee; }
  .ig .post .av { width: 34px; height: 34px; border-radius: 50%; display: grid; place-items: center; background: #fff; box-shadow: 0 0 0 2px #e1306c; }
  .ig .post .av img { width: 26px; }
  .ig .post b { display: block; font-size: 14px; } .ig .post small { display: block; font-size: 12px; color: #666; }
  .ig .media { position: relative; width: 100%; aspect-ratio: 1/1; background: #000; }
  .ig .media video { width: 100%; height: 100%; object-fit: cover; display: block; }
  .ig .igcta { display: flex; justify-content: space-between; align-items: center; padding: 11px 14px; background: #EEF2FB; color: var(--royal); font-weight: 600; font-size: 14.5px; }
  .ig .acts { display: flex; gap: 16px; padding: 12px 14px 6px; } .ig .acts svg { width: 25px; height: 25px; }
  .ig .capt { padding: 4px 14px; font-size: 13.5px; line-height: 1.45; } .ig .capt b { font-weight: 600; }
  .toast { position: absolute; width: 470px; border-radius: 22px; padding: 16px 18px; display: flex; gap: 14px; align-items: center;
    background: rgba(255,255,255,.88); backdrop-filter: blur(16px); box-shadow: 0 30px 60px -28px rgba(20,46,140,.45), 0 0 0 1px rgba(20,46,140,.06); }
  .toast .app { width: 46px; height: 46px; border-radius: 12px; display: grid; place-items: center; flex: none; background: #fff; box-shadow: 0 0 0 1px #e8ecf5; }
  .toast .app svg { width: 30px; height: 30px; }
  .toast .tt { flex: 1; } .toast .tt small { display: flex; justify-content: space-between; font-size: 12.5px; color: #6b7280; letter-spacing: .02em; }
  .toast .tt b { display: block; margin-top: 3px; font-size: 18px; font-weight: 600; color: #0B0D0D; letter-spacing: -0.01em; }
  .toast .tt b em { font-style: normal; color: var(--royal); }

  /* option C: dark studio */
  .big .n { font-size: 112px; font-weight: 600; letter-spacing: -0.05em; line-height: .9; color: #fff; }
  .big .n sup { font-size: .42em; color: var(--sky); vertical-align: top; margin-left: 4px; }
  .big .l { margin-top: 12px; font-size: 18px; color: rgba(255,255,255,.7); }
  .big .tag { display: inline-flex; margin-top: 14px; font-size: 12.5px; font-weight: 600; letter-spacing: .12em; text-transform: uppercase; color: var(--sky); padding: 7px 12px; border-radius: 999px; border: 1px solid rgba(56,189,248,.4); }
  .livepill { display: flex; align-items: center; gap: 10px; padding: 12px 20px; border-radius: 999px; font-size: 14px; font-weight: 600; letter-spacing: .12em; text-transform: uppercase; color: #fff; background: rgba(255,255,255,.08); border: 1px solid rgba(255,255,255,.18); }
  .livepill i { width: 9px; height: 9px; border-radius: 50%; background: #34D399; box-shadow: 0 0 0 5px rgba(52,211,153,.2); }
</style></head>
<body><div id="stage"></div>
<script>
const O = new URLSearchParams(location.search).get("o") || "A";
const T = 16, TAU = Math.PI * 2;

const vids = [...document.querySelectorAll("video")];
const ease = (x) => 1 - Math.pow(1 - Math.min(1, Math.max(0, x)), 3);

  const pr = document.getElementById("pr"); if (pr) pr.style.width = (25 + 60 * ease((lt % 8) / 4)) + "%";
  const tr = document.getElementById("tr"); if (tr) { const L = tr.getTotalLength(), g = ease((lt % 8) / 4); tr.style.strokeDasharray = `${L} ${L + 20}`; tr.style.strokeDashoffset = L * (1 - g); [...document.querySelectorAll("#bars rect")].forEach((r, i) => { const h0 = [26, 38, 50, 64][i], h = h0 * (.3 + .7 * Math.min(1, Math.max(0, g * 1.3 - i * .1))); r.setAttribute("y", 90 - h); r.setAttribute("height", h); }); }
